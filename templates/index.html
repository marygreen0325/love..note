<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>for youuu ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background: url('{{ content.bg_image_url }}') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Courier Prime', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Lighter, softer overlay so the background shines through beautifully */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100vh; height: 100vh; height: 100dvh;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(1.5px);
            z-index: 1;
        }

        /* Tap to Open Screen */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }

        #start-overlay h2 {
            font-size: 1.4rem;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        #start-overlay p {
            font-size: 0.85rem;
            color: #ddd;
            font-family: -apple-system, sans-serif;
        }

        /* Paper Letter Card */
        .paper-card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 380px;
            background-color: #faf6ee; 
            color: #2b2b2b;
            padding: 35px 25px;
            border-radius: 6px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25), 0 2px 6px rgba(0,0,0,0.1);
            overflow-y: auto;
            max-height: 62vh;
            margin-bottom: 75px;
        }

        .typewriter-text {
            font-size: 0.95rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 16px;
            background-color: #2b2b2b;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Spotify / Apple Music Style Player */
        .music-player {
            position: fixed;
            bottom: 30px;
            z-index: 10;
            width: 90%;
            max-width: 380px;
            background: rgba(84, 57, 41, 1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 35px;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .play-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            outline: none;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .track-title {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-name {
            font-size: 0.72rem;
            color: #a0a0a0;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Equalizer Bars */
        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
        }

        .bar {
            width: 3px;
            background-color: #1db954;
            border-radius: 2px;
            height: 4px;
        }

        .equalizer.playing .bar {
            animation: bounce 1.2s infinite ease-in-out alternate;
        }

        .equalizer.playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .equalizer.playing .bar:nth-child(2) { animation-delay: 0.4s; }
        .equalizer.playing .bar:nth-child(3) { animation-delay: 0.2s; }
        .equalizer.playing .bar:nth-child(4) { animation-delay: 0.5s; }
        .equalizer.playing .bar:nth-child(5) { animation-delay: 0.3s; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 16px; }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- Enhanced Tap-to-Start Screen -->
    <div id="start-overlay">
        <h2>💌 hiiii :]</h2>
        <p>tap anywhere to open the letter handsome</p>
    </div>

    <!-- Paper Container -->
    <div class="paper-card">
        <span id="typed-text" class="typewriter-text"></span><span class="cursor" id="cursor"></span>
    </div>

    <!-- Music Player -->
    <div class="music-player">
        <div class="player-left">
            <button class="play-btn" id="play-pause-btn">❚❚</button>
            <div class="track-info">
                <span class="track-title">{{ content.song_title }}</span>
                <span class="artist-name">{{ content.artist_name }}</span>
            </div>
        </div>
        
        <div class="equalizer" id="equalizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="bg-music" src="{{ content.song_url }}" preload="auto" loop></audio>

    <div id="letter-text-data" data-letter-text="{{ content.message | e }}" hidden></div>

    <script>
        const fullText = document.getElementById("letter-text-data").dataset.letterText;
        const typedTextElement = document.getElementById("typed-text");
        const music = document.getElementById("bg-music");
        const startOverlay = document.getElementById("start-overlay");
        const playBtn = document.getElementById("play-pause-btn");
        const equalizer = document.getElementById("equalizer");

        let audioCtx;
        let hasStarted = false;

        function playClickSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140 + Math.random() * 60, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch(e) {}
        }

        let charIndex = 0;
        function typeWriter() {
            if (charIndex < fullText.length) {
                const char = fullText.charAt(charIndex);
                typedTextElement.textContent += char;
                
                if (char !== ' ' && char !== '\n') {
                    playClickSound();
                }

                charIndex++;
                const speed = Math.floor(Math.random() * (65 - 35 + 1)) + 35;
                setTimeout(typeWriter, speed);
            }
        }

        // Bulletproof touch/click handler for mobile browsers
        function startExperience(e) {
            if (hasStarted) return;
            hasStarted = true;

            // Hide start screen immediately
            startOverlay.style.opacity = '0';
            setTimeout(() => {
                startOverlay.style.display = 'none';
            }, 300);

            // Initialize AudioContext safely inside user gesture
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // Play background music
            music.play().then(() => {
                equalizer.classList.add("playing");
            }).catch(err => {
                console.log("Audio playback prevented:", err);
            });

            // Start typing
            typeWriter();
        }

        startOverlay.addEventListener("click", startExperience);
        startOverlay.addEventListener("touchend", startExperience);

        // Music player manual toggle
        playBtn.addEventListener("click", () => {
            if (music.paused) {
                music.play();
                playBtn.textContent = "❚❚";
                equalizer.classList.add("playing");
            } else {
                music.pause();
                playBtn.textContent = "▶";
                equalizer.classList.remove("playing");
            }
        });
    </script>
</body>
</html>
